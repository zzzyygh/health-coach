plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// ── release 签名 ────────────────────────────────────────────────
// 密钥与密码都放在**仓库之外**（keystore.properties 已被 .gitignore 排除），
// 这样 clone 下来的人拿不到私钥；他们构建 release 时会回退到 debug 签名。
def keystorePropsFile = rootProject.file('keystore.properties')
def externalKeystore = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { externalKeystore.load(it) }
}
def hasReleaseKey = keystorePropsFile.exists() && externalKeystore['storeFile']

android {
    namespace 'com.zzzyy.healthcoach'
    compileSdk 35

    defaultConfig {
        applicationId "com.zzzyy.healthcoach"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        debug {
            // 项目内自带一份 debug keystore，便于在 ~/.android 不可写的环境里构建；
            // 没有这个文件时回退到 Gradle 默认的 debug 签名
            if (file('../keystore/debug.keystore').exists()) {
                storeFile file('../keystore/debug.keystore')
            }
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // 只有本机放了 keystore.properties 才会有这个配置
        if (hasReleaseKey) {
            release {
                storeFile file(externalKeystore['storeFile'])
                storePassword externalKeystore['storePassword']
                keyAlias externalKeystore['keyAlias']
                keyPassword externalKeystore['keyPassword']
            }
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true   // 让 Log.* 在 JVM 单测里变成空操作
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            // 有正式密钥就用正式的；没有（别人 clone 的仓库）回退 debug 签名，保证能构建
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/*.kotlin_module']
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    testImplementation 'junit:junit:4.13.2'
    // Android 的 org.json 在 JVM 单测里是 stub，这里用真实实现解析测试向量
    testImplementation 'org.json:json:20240303'
}
